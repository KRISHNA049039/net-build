name: django_platform

# ================================================================
#  PC .100  (192.168.4.100)  ->  cassandra-1  (one node)
# ================================================================

networks:
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  cassandra-data-1: { name: cassandra-data-1 }

services:

  cassandra-1:
    image: cassandra:5.0.7-bookworm
    container_name: cassandra-1
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "7000:7000"
      - "9042:9042"
    volumes:
      - cassandra-data-1:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-cluster
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_NUM_TOKENS: 16
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_ADDRESS: 192.168.4.100
      CASSANDRA_BROADCAST_RPC_ADDRESS: 192.168.4.100
      CASSANDRA_SEEDS: "192.168.4.100:7000,192.168.4.102:7000"
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' || exit 1" ]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 300s

  cassandra-web-ui:
    image: ipushc/cassandra-web:v1.1.5
    container_name: cassandra-web-ui
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "8890:8083"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      HOST_PORT: ":8083"
      CASSANDRA_HOST: cassandra-1
      CASSANDRA_PORT: "9042"
