name: django_platform

# Generic single-node Cassandra host file. The SAME file runs on every
# machine -- airgapped PC or AWS EC2 test instance -- only the .env
# passed via --env-file changes (identity, rack, seeds, bind address).
#
#   docker compose --env-file envs/<node>.env -f docker-compose.node.yml up -d
#
# See ../AWS_RUNBOOK.md (AWS test) and RUNBOOK.md (airgapped) for the
# full bring-up sequence, firewall/security-group rules, and node order.

networks:
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  cassandra-data: { name: "cassandra-data-${NODE_NAME}" }

services:
  cassandra:
    image: cassandra:5.0.7-bookworm
    container_name: "${NODE_NAME}"
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "7000:7000"   # inter-node storage/gossip
      - "9042:9042"   # CQL native transport
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-cluster
      CASSANDRA_DC: "${CASSANDRA_DC:-datacenter-1}"
      CASSANDRA_RACK: "${CASSANDRA_RACK}"
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_ADDRESS: "${BIND_IP}"
      CASSANDRA_BROADCAST_RPC_ADDRESS: "${BIND_IP}"
      CASSANDRA_SEEDS: "${SEED_IPS}"
      MAX_HEAP_SIZE: "${MAX_HEAP_SIZE:-512M}"
      HEAP_NEWSIZE: "${HEAP_NEWSIZE:-128M}"
      # Set to -Dcassandra.replace_address_first_boot=<dead-node-ip> in the
      # .env when replacing a dead node -- see ../RECOVERY.md. Leave unset
      # otherwise.
      JVM_EXTRA_OPTS: "${JVM_EXTRA_OPTS:-}"
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' || exit 1" ]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 300s
