name: django_platform

# ================================================================
#  PC .101  (192.168.4.101)  ->  cassandra-2  (one node)
# ================================================================

networks:
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  cassandra-data-2: { name: cassandra-data-2 }

services:

  cassandra-2:
    image: cassandra:5.0.7-bookworm
    container_name: cassandra-2
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "7000:7000"
      - "9042:9042"
    volumes:
      - cassandra-data-2:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-cluster
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_NUM_TOKENS: 16
      CASSANDRA_LISTEN_ADDRESS: auto
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_ADDRESS: 192.168.4.101
      CASSANDRA_BROADCAST_RPC_ADDRESS: 192.168.4.101
      CASSANDRA_SEEDS: "192.168.4.100:7000,192.168.4.102:7000"
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' || exit 1" ]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 300s
