name: django_platform

networks:
  backend-network:
    name: backend-network
    driver: bridge

volumes:
  cassandra-data-1: { name: cassandra-data-1 }
  cassandra-data-2: { name: cassandra-data-2 }
  cassandra-data-3: { name: cassandra-data-3 }
  cassandra-data-4: { name: cassandra-data-4 }
  cassandra-data-5: { name: cassandra-data-5 }

# ---- shared env (YAML anchor, merged into each node) ----
x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: cassandra-cluster
  CASSANDRA_DC: datacenter-1
  CASSANDRA_RACK: rack-1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_NUM_TOKENS: 16
  CASSANDRA_LISTEN_ADDRESS: auto
  CASSANDRA_RPC_ADDRESS: 0.0.0.0
  CASSANDRA_SEEDS: "cassandra-1,cassandra-2"   # 2 seeds for a 5-node ring
  MAX_HEAP_SIZE: 512M                          # 5 x 512M = ~2.5G heap total
  HEAP_NEWSIZE: 128M

x-cassandra-common: &cassandra-common
  image: cassandra:5.0.7-bookworm
  restart: unless-stopped
  networks:
    - backend-network
  entrypoint: ["bash", "/auth-entrypoint.sh"]   # enables PasswordAuthenticator -- see AUTH.md
  healthcheck:
    # Uses the built-in superuser by default -- if you rotate its
    # password (you should, see AUTH.md), set these two in .env to
    # match, or point them at a dedicated low-privilege role instead.
    test: [ "CMD-SHELL", "cqlsh -u ${CASSANDRA_HEALTHCHECK_USER:-cassandra} -p ${CASSANDRA_HEALTHCHECK_PASSWORD:-cassandra} -e 'DESCRIBE KEYSPACES' || exit 1" ]
    interval: 20s
    timeout: 10s
    retries: 20
    start_period: 180s

services:

  cassandra-1:
    <<: *cassandra-common
    container_name: cassandra-1
    ports:
      - "9042:9042"          # host entry point
    volumes:
      - cassandra-data-1:/var/lib/cassandra
      - ./docker/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    environment:
      <<: *cassandra-env
      CASSANDRA_BROADCAST_ADDRESS: cassandra-1
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-1

  cassandra-2:
    <<: *cassandra-common
    container_name: cassandra-2
    ports:
      - "9043:9042"          # optional second host entry point
    volumes:
      - cassandra-data-2:/var/lib/cassandra
      - ./docker/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    environment:
      <<: *cassandra-env
      CASSANDRA_BROADCAST_ADDRESS: cassandra-2
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-2
    depends_on:
      cassandra-1:
        condition: service_healthy

  cassandra-3:
    <<: *cassandra-common
    container_name: cassandra-3
    volumes:
      - cassandra-data-3:/var/lib/cassandra
      - ./docker/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    environment:
      <<: *cassandra-env
      CASSANDRA_BROADCAST_ADDRESS: cassandra-3
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-3
    depends_on:
      cassandra-2:
        condition: service_healthy

  cassandra-4:
    <<: *cassandra-common
    container_name: cassandra-4
    volumes:
      - cassandra-data-4:/var/lib/cassandra
      - ./docker/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    environment:
      <<: *cassandra-env
      CASSANDRA_BROADCAST_ADDRESS: cassandra-4
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-4
    depends_on:
      cassandra-3:
        condition: service_healthy

  cassandra-5:
    <<: *cassandra-common
    container_name: cassandra-5
    volumes:
      - cassandra-data-5:/var/lib/cassandra
      - ./docker/auth-entrypoint.sh:/auth-entrypoint.sh:ro
    environment:
      <<: *cassandra-env
      CASSANDRA_BROADCAST_ADDRESS: cassandra-5
      CASSANDRA_BROADCAST_RPC_ADDRESS: cassandra-5
    depends_on:
      cassandra-4:
        condition: service_healthy

  cassandra-web-ui:
    image: ipushc/cassandra-web:v1.1.5
    container_name: cassandra-web-ui
    restart: unless-stopped
    networks:
      - backend-network
    ports:
      - "8890:8083"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      HOST_PORT: ":8083"
      CASSANDRA_HOST: cassandra-1
      CASSANDRA_PORT: "9042"
      # Defaults to the built-in superuser -- update after rotating its
      # password (see AUTH.md), or point at a dedicated read-only role.
      CASSANDRA_USERNAME: "${CASSANDRA_WEBUI_USER:-cassandra}"
      CASSANDRA_PASSWORD: "${CASSANDRA_WEBUI_PASSWORD:-cassandra}"
