server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: backend-monolith
    static_configs:
      - targets: [localhost]
        labels:
          job: backend-monolith
          service: backend-monolith
          env: monolith
          __path__: /var/log/backend-monolith/*.log
