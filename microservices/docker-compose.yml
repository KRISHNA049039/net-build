name: net_build_microservices

# Attaches to the SAME docker network the Cassandra cluster already runs on
# (created by casssndra/docker-compose.cluster.yml or casssndra/dis/*) --
# bring that up first. Each service's .env (copy from its .env.template)
# should point CASSANDRA_HOSTS at that cluster's container names/IPs.
networks:
  backend-network:
    name: backend-network
    external: true

services:
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    restart: unless-stopped
    networks:
      - backend-network
    env_file:
      - ./services/catalog-service/.env
    ports:
      - "8001:8001"     # direct access for local debugging; go through the
                          # gateway (below) for anything meant to simulate prod
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health/', timeout=3)\" || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ff-net-service:
    build: ./services/ff-net-service
    container_name: ff-net-service
    restart: unless-stopped
    networks:
      - backend-network
    env_file:
      - ./services/ff-net-service/.env
    ports:
      - "8002:8002"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health/', timeout=3)\" || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    networks:
      - backend-network
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      catalog-service:
        condition: service_healthy
      ff-net-service:
        condition: service_healthy
