name: net_build_microservices

# Attaches to the SAME docker network the Cassandra cluster already runs on
# (created by casssndra/docker-compose.cluster.yml or casssndra/dis/*) --
# bring that up first. Each service's .env (copy from its .env.template)
# should point CASSANDRA_HOSTS at that cluster's container names/IPs.
networks:
  backend-network:
    name: backend-network
    external: true

volumes:
  catalog-logs: { name: catalog-service-logs }
  ff-net-logs: { name: ff-net-service-logs }

services:
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    restart: unless-stopped
    networks:
      - backend-network
    env_file:
      - ./services/catalog-service/.env
    volumes:
      - catalog-logs:/app/logs     # tailed by promtail below -- see ../logging/CENTRALIZED_LOGGING.md
    ports:
      - "8001:8001"     # direct access for local debugging; go through the
                          # gateway (below) for anything meant to simulate prod
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health/', timeout=3)\" || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ff-net-service:
    build: ./services/ff-net-service
    container_name: ff-net-service
    restart: unless-stopped
    networks:
      - backend-network
    env_file:
      - ./services/ff-net-service/.env
    volumes:
      - ff-net-logs:/app/logs      # tailed by promtail below -- see ../logging/CENTRALIZED_LOGGING.md
    ports:
      - "8002:8002"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health/', timeout=3)\" || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    image: kong:3.7
    container_name: gateway
    restart: unless-stopped
    networks:
      - backend-network
    environment:
      KONG_DATABASE: "off"                                   # DB-less: kong.yml below is the whole config
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"                     # used by the healthcheck below
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"                    # admin API off the network, not just off the host
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8080:8000"     # proxy -- same external port the nginx gateway used
    healthcheck:
      test: [ "CMD", "kong", "health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      catalog-service:
        condition: service_healthy
      ff-net-service:
        condition: service_healthy

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail-microservices
    restart: unless-stopped
    networks:
      - backend-network
    volumes:
      - catalog-logs:/var/log/catalog-service:ro
      - ff-net-logs:/var/log/ff-net-service:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    environment:
      # Central Loki (../logging/). Override if it runs on a different
      # host than this one -- e.g. LOKI_URL=http://192.168.4.100:3100
      LOKI_URL: "${LOKI_URL:-http://loki:3100}"
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
