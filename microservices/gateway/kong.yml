# Kong declarative config (DB-less mode -- no Postgres to run/backup
# airgapped, this file IS the gateway's entire config). Reload after
# editing: docker exec gateway kong reload, or `docker compose restart gateway`.
#
# Routing convention (same as the nginx version it replaces): each route's
# path prefix is stripped before forwarding, so /catalog/<x> reaches
# catalog-service as /<x> -- the gateway only routes, it never rewrites a
# service's own internal URL structure. See ../ARCHITECTURE.md section 3.
_format_version: "3.0"
_transform: true

services:
  - name: catalog-service
    url: http://catalog-service:8001
    routes:
      - name: catalog-route
        paths:
          - /catalog
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: ff-net-service
    url: http://ff-net-service:8002
    routes:
      - name: ff-net-route
        paths:
          - /ff_net
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

# Rate-limiting only, per service (300 req/min, policy "local" -- counted
# in-process, no Redis needed, fine for the single-Kong-instance topology
# here; see Kong's docs before adding a second gateway instance, "local"
# doesn't share counts across replicas). Non-breaking -- no key required,
# just a cap, so it's safe with every current caller.
#
# No auth (key-auth etc.) -- matches the current CORS_ALLOW_ALL_ORIGINS
# permissive stance for this trusted internal network, and adding it would
# break every existing caller (they'd all need a key). Add it once there's
# a real external/untrusted caller to protect against, not preemptively --
# see ../ARCHITECTURE.md section 6.
