events {}

http {
  upstream catalog_service { server catalog-service:8001; }
  upstream ff_net_service   { server ff-net-service:8002; }

  server {
    listen 80;

    # Everything after the service-name prefix is that service's own native
    # path (e.g. /catalog/api/catalog/orders/, /catalog/health/,
    # /catalog/api/schema/swagger-ui/) -- the gateway only routes, it
    # doesn't rewrite each service's internal URL structure.

    location /catalog/ {
      proxy_pass http://catalog_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ff_net/ {
      proxy_pass http://ff_net_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      return 200 'gateway ok';
      add_header Content-Type text/plain;
    }
  }
}
